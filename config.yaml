# Network and Server Configuration
app:
  host: "0.0.0.0"               # Network interface to bind to (0.0.0.0 allows external access)
  port: 8000                   # Port number for the web interface and API

# AI Model Configuration
models:
  # ASR (Automatic Speech Recognition) - Faster-Whisper
  asr:
    model_size: "large-v3"      # Whisper model variant (large-v3 is most accurate)
    min_confidence: 0.7        # Min. probability (0-1) required to start translation
    device: "cuda"             # Hardware for transcription (cuda = GPU, cpu = Processor)

  # LLM (Large Language Model) - Translation Engine
  llm:
    # --- MISTRAL (Recommended for pure translation) ---
    engine_type: "llama"       # Driver for Mistral or Llama-3 models
    model_path: "models/Mistral-7B-Instruct-v0.3-Q4_K_M.gguf" # File path to the LLM
    
    # --- QWEN (Previous Model - Uncomment to switch back) ---
    # engine_type: "qwen"       # Driver for Qwen models (uses ChatML format)
    # model_path: "models/Qwen2.5-7B-Instruct-Q4_K_M.gguf"

    n_ctx: 2048                # Max. memory for conversation history (tokens)
    n_gpu_layers: -1           # Number of model layers on GPU (-1 = all, max speed)

  # TTS (Text-to-Speech) - Coqui XTTS v2
  tts:
    device: "cuda"             # Hardware for voice synthesis (cuda = GPU, cpu = Processor)

  # Voice Activity Detection (VAD) Settings
  vad:
    threshold: 0.5             # Sensitivity (0-1); higher ignores more background noise
    min_silence_duration_ms: 300 # Required silence (ms) to detect end of a sentence
    padding_ms: 10              # Extra audio buffer (ms) added to prevent clipping words
