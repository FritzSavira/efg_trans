services:
  s2s-app:
    build: .
    container_name: s2s_translator
    ports:
      - "8000:8000"
    volumes:
      # Mount the models cache so we don't re-download models on every rebuild
      - ./models_cache:/app/models_cache
      # NEW: Mount the specific models folder where the GGUF file lives
      - ./models:/app/models
      # NEW: Mount uploads folder so speaker refs survive container restarts
      - ./uploads:/app/uploads
      # Mount the source code for development
      - ./src:/app/src
      - ./static:/app/static
      - ./config.yaml:/app/config.yaml
    environment:
      - XDG_CACHE_HOME=/app/models_cache
      - COQUI_TOS_AGREED=1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]